appId: io.avanpost.antiavg
productName: AntiAvg
copyright: © 2026 Avanpost.io

directories:
  output: release
  # ВАЖНО: не `build` — там лежит скомпилированный main-процесс.
  buildResources: build-resources

files:
  - build/**/*
  - renderer/**/*
  - preload.cjs
  - package.json
  - from: ../dist
    to: core
  - from: ../node_modules
    to: node_modules
    filter:
      - ws/**/*
      - undici/**/*
      - zod/**/*
      - https-proxy-agent/**/*
      - socks-proxy-agent/**/*
      - agent-base/**/*
      - socks/**/*
      - ip-address/**/*
      - smart-buffer/**/*
      - debug/**/*
      - ms/**/*

win:
  target: nsis
  publisherName: Avanpost.io
  icon: build-resources/icon.ico
  artifactName: AntiAvg-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AntiAvg
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico

mac:
  target: dmg
  icon: build-resources/icon.png
  category: public.app-category.finance
